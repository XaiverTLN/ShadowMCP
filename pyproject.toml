[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowmcp"
version = "0.1.0"
description = "MCP tool-call firewall with human review and active-deception routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "openai",
    "pydantic",
    "python-dotenv",
    "pandas",
    "plotly",
]

[project.optional-dependencies]
adk = ["google-adk"]
dev = ["pytest"]

[project.scripts]
shadowmcp = "shadowmcp.cli:main"
shadowmcp-proxy = "shadowmcp.proxy:main"
shadowmcp-dashboard = "shadowmcp.dashboard:main"

[tool.setuptools]
packages = ["shadowmcp", "shadowmcp.adapters"]
py-modules = ["shadow_mcp", "shadow_mcp_proxy", "llm_client", "app"]
include-package-data = true

[tool.setuptools.package-data]
shadowmcp = ["data/*.json"]
